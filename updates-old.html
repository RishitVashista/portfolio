 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Daily Report — Rishit Vashist</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary: #070d35;
      --bg-secondary: #0f172a;
      --bg-card: #1e293b;
      --text-primary: #e2e8f0;
      --text-secondary: #94a3b8;
      --accent: #64ffda;
      --accent-dark: #4dd0b8;
      --border: #1e293b;
      --code-bg: #0d1117;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 6rem 1rem 4rem;
      line-height: 1.7;
      overflow-x: hidden;
    }

    ::selection {
      background: var(--accent);
      color: var(--bg-primary);
    }

    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: var(--bg-card); border-radius: 5px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

    .container { max-width: 720px; margin: 0 auto; }

    /* ── Nav ── */
    nav {
      display: flex;
      gap: 2rem;
      margin-bottom: 3rem;
      padding: 0 0.5rem;
      flex-wrap: wrap;
    }
    nav a {
      color: var(--text-primary);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      position: relative;
      transition: 0.3s;
    }
    nav a::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--accent);
      transition: width 0.3s;
    }
    nav a:hover { color: var(--accent); }
    nav a:hover::after { width: 100%; }
    nav a.active { color: var(--accent); }
    nav a.active::after { width: 100%; }

    /* ── Header ── */
    header { margin-bottom: 2rem; padding: 0 0.5rem; }

    .greeting {
      color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      margin-bottom: 0.75rem;
      letter-spacing: 0.02em;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 2.8rem);
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 0.75rem;
      background: linear-gradient(135deg, #e2e8f0 0%, #64ffda 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle { color: var(--text-secondary); font-size: 1rem; }

    /* ── Stats ── */
    .stats-row {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .stat-card {
      flex: 1;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem 1.4rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      transition: all 0.3s ease;
    }
    .stat-card:hover {
      border-color: var(--accent);
      transform: translateY(-3px);
      box-shadow: 0 15px 30px rgba(100, 255, 218, 0.08);
    }
    .stat-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-secondary);
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
    }
    .stat-value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
      line-height: 1.1;
    }

    /* ── Calendar card ── */
    .calendar-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }
    .calendar-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 3px;
      background: linear-gradient(90deg, var(--accent), transparent);
    }

    .month-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
      padding: 0 0.25rem;
    }
    .month-label {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text-primary);
    }
    .month-count {
      font-size: 0.8rem;
      color: var(--text-secondary);
      font-weight: 500;
      font-family: 'JetBrains Mono', monospace;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }
    .weekday {
      text-align: center;
      font-size: 0.65rem;
      color: var(--text-secondary);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.5rem 0;
      font-family: 'JetBrains Mono', monospace;
    }
    .day {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      cursor: pointer;
      background: var(--bg-card);
      border: 1px solid transparent;
      transition: all 0.2s ease;
      user-select: none;
      gap: 1px;
    }
    .day.empty { background: transparent; cursor: default; }
    .day.future { opacity: 0.25; cursor: not-allowed; }
    .day:not(.empty):not(.future):hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      box-shadow: 0 4px 12px rgba(100, 255, 218, 0.15);
    }
    .day.done {
      background: rgba(100, 255, 218, 0.12);
      border-color: var(--accent);
      color: var(--accent);
    }
    .day.done:hover {
      box-shadow: 0 4px 12px rgba(100, 255, 218, 0.3);
    }
    .day.today {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .day .num {
      font-size: 0.85rem;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
    }
    .day.done .num { color: var(--accent); }
    .day .tick {
      font-size: 0.65rem;
      line-height: 1;
      font-weight: 800;
      color: var(--accent);
    }

    /* ── Panel ── */
    .panel {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.75rem;
      min-height: 120px;
      position: relative;
      overflow: hidden;
    }
    .panel::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 3px;
      background: linear-gradient(90deg, var(--accent), transparent);
    }
    .panel h3 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 1.1rem;
      color: var(--text-primary);
    }
    .panel textarea {
      width: 100%;
      min-height: 140px;
      padding: 1rem;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-primary);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      resize: vertical;
      transition: border-color 0.2s, box-shadow 0.2s;
      line-height: 1.6;
    }
    .panel textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(100, 255, 218, 0.1);
    }
    .panel textarea::placeholder { color: var(--text-secondary); }
    .panel textarea[readonly] {
      background: var(--bg-card);
      color: var(--text-secondary);
      cursor: default;
    }

    /* ── PIN form ── */
    .pin-form {
      display: flex;
      gap: 0.6rem;
      margin-bottom: 1rem;
    }
    .pin-input {
      flex: 1;
      padding: 0.9rem 1rem;
      background: var(--bg-primary);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      color: var(--text-primary);
      font-family: 'JetBrains Mono', monospace;
      font-size: 1rem;
      letter-spacing: 0.3em;
      text-align: center;
      font-weight: 600;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .pin-input::placeholder {
      color: var(--text-secondary);
      letter-spacing: 0.05em;
      font-weight: 400;
    }
    .pin-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(100, 255, 218, 0.1);
    }

    .pin-btn {
      background: var(--accent);
      color: var(--bg-primary);
      border: 2px solid var(--accent);
      padding: 0.9rem 1.6rem;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.9rem;
      font-family: 'Inter', sans-serif;
      transition: all 0.3s ease;
    }
    .pin-btn:hover {
      background: transparent;
      color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(100, 255, 218, 0.25);
    }
    .pin-hint {
      color: var(--text-secondary);
      font-size: 0.8rem;
      font-family: 'JetBrains Mono', monospace;
    }

    /* ── Save button ── */
    .save-btn {
      margin-top: 1rem;
      background: var(--accent);
      color: var(--bg-primary);
      border: 2px solid var(--accent);
      padding: 0.8rem 1.8rem;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.9rem;
      font-family: 'Inter', sans-serif;
      transition: all 0.3s ease;
    }
    .save-btn:hover {
      background: transparent;
      color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(100, 255, 218, 0.25);
    }
    .save-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .status {
      margin-left: 1rem;
      font-size: 0.85rem;
      color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
    }

    .past-content {
      color: var(--text-secondary);
      line-height: 1.7;
      white-space: pre-wrap;
      margin: 0;
      font-size: 0.95rem;
    }

    .lock-badge {
      display: inline-block;
      margin-top: 1rem;
      font-size: 0.75rem;
      color: var(--text-secondary);
      background: var(--bg-card);
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      font-weight: 500;
      font-family: 'JetBrains Mono', monospace;
      border: 1px solid var(--border);
    }

    .empty-panel {
      color: var(--text-secondary);
      text-align: center;
      padding: 1.5rem;
      font-size: 0.9rem;
      font-family: 'JetBrains Mono', monospace;
    }

    /* ── Footer ── */
    .footer-bar {
      margin-top: 1.5rem;
      text-align: center;
    }
    .footer-bar button {
      color: var(--text-secondary);
      background: none;
      border: none;
      cursor: pointer;
      text-decoration: underline;
      font-size: 0.8rem;
      font-family: inherit;
      transition: color 0.2s;
    }
    .footer-bar button:hover { color: var(--accent); }

    .site-footer {
      margin-top: 3rem;
      text-align: center;
      padding-top: 2rem;
      border-top: 1px solid var(--border);
    }
    .site-footer p {
      color: var(--text-secondary);
      font-size: 0.85rem;
      margin-bottom: 0.4rem;
    }
    .site-footer .highlight { color: var(--accent); font-weight: 600; }
    .site-footer .copyright { font-size: 0.75rem; opacity: 0.7; }

    /* ── Mobile ── */
    @media (max-width: 600px) {
      body { padding: 5rem 0.75rem 3rem; }
      nav { gap: 1.2rem; }
      .stats-row { flex-direction: column; }
      .pin-form { flex-direction: column; }
      .pin-btn { padding: 0.9rem; }
      .calendar-card { padding: 1rem; }
      .panel { padding: 1.3rem; }
    }
  </style>
</head>
<body>

  <div class="container">

    <nav>
      <a href="index.html">Home</a>
      <a href="index.html#about">About</a>
      <a href="index.html#skills">Skills</a>
      <a href="index.html#projects">Projects</a>
      <a href="index.html#contact">Contact</a>
      <a href="updates.html" class="active">Updates</a>
    </nav>

    <header>
      <p class="greeting">// daily_build_log</p>
      <h1>Daily Report</h1>
      <p class="subtitle">A day-by-day log of what I'm building — consistency over intensity.</p>
    </header>

    <div class="stats-row">
      <div class="stat-card">
        <span class="stat-label">Current Streak</span>
        <span class="stat-value" id="streakValue">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Total Days</span>
        <span class="stat-value" id="totalValue">0</span>
      </div>
    </div>

    <div class="calendar-card">
      <div class="month-header">
        <span class="month-label" id="monthLabel"></span>
        <span class="month-count" id="monthCount"></span>
      </div>
      <div class="calendar" id="calendar"></div>
    </div>

    <div class="panel" id="panel">
      <p class="empty-panel">Click any date to view or edit</p>
    </div>

    <div class="footer-bar" id="footerBar"></div>

    <footer class="site-footer">
      <p>Designed &amp; Built by <span class="highlight">Rishit Vashist</span></p>
      <p class="copyright">© 2025 Rishit Vashista. All rights reserved.</p>
    </footer>

  </div>

  <script>
    var PIN_CODE = '0007';

    var SUPABASE_URL = 'https://qzdxemghuzbswucddioq.supabase.co';
    var SUPABASE_ANON_KEY = 'sb_publishable_4v18pmzVnfVrfnmbHxmiJw_FhXCMQu0';

    var client = null;
    var allEntries = {};
    var today = new Date().toLocaleDateString('en-CA');
    var UNLOCK_KEY = 'daily_report_unlocked';

    var $calendar = document.getElementById('calendar');
    var $panel = document.getElementById('panel');
    var $monthLabel = document.getElementById('monthLabel');
    var $monthCount = document.getElementById('monthCount');
    var $streakValue = document.getElementById('streakValue');
    var $totalValue = document.getElementById('totalValue');
    var $footerBar = document.getElementById('footerBar');

    function todayISO() {
      return new Date().toLocaleDateString('en-CA');
    }

    function isUnlocked() {
      try {
        var raw = localStorage.getItem(UNLOCK_KEY);
        if (!raw) return false;
        var data = JSON.parse(raw);
        return data.date === todayISO() && data.unlocked === true;
      } catch (e) {
        return false;
      }
    }

    function setUnlocked() {
      try {
        localStorage.setItem(UNLOCK_KEY, JSON.stringify({
          date: todayISO(),
          unlocked: true
        }));
      } catch (e) {}
    }

    function clearUnlocked() {
      try { localStorage.removeItem(UNLOCK_KEY); } catch (e) {}
    }

    function init() {
      if (!window.supabase) {
        $panel.innerHTML = '<p class="empty-panel">Failed to load. Check your internet connection.</p>';
        return;
      }
      client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      client.from('updates').select('log_date, content').then(function(res) {
        if (res.error) {
          $panel.innerHTML = '<p class="empty-panel">Database error: ' + res.error.message + '</p>';
          return;
        }
        allEntries = {};
        if (res.data) {
          for (var i = 0; i < res.data.length; i++) {
            allEntries[res.data[i].log_date] = res.data[i].content;
          }
        }
        $panel.innerHTML = '<p class="empty-panel">Click any date to view or edit</p>';
        render();
      });
    }

    function render() {
      renderCalendar();
      renderStats();
      renderFooter();
    }

    function renderCalendar() {
      $calendar.innerHTML = '';

      var days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      for (var w = 0; w < 7; w++) {
        var wd = document.createElement('div');
        wd.className = 'weekday';
        wd.textContent = days[w];
        $calendar.appendChild(wd);
      }

      var now = new Date();
      var year = now.getFullYear();
      var month = now.getMonth();
      var firstDay = new Date(year, month, 1).getDay();
      var daysInMonth = new Date(year, month + 1, 0).getDate();

      $monthLabel.textContent = now.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

      var monthCount = 0;

      for (var i = 0; i < firstDay; i++) {
        var empty = document.createElement('div');
        empty.className = 'day empty';
        $calendar.appendChild(empty);
      }

      for (var d = 1; d <= daysInMonth; d++) {
        var iso = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
        var cell = document.createElement('div');
        cell.className = 'day';

        var hasEntry = allEntries[iso] && allEntries[iso].trim();
        if (hasEntry) monthCount++;

        var isToday = iso === today;
        var isFuture = iso > today;

        if (hasEntry) cell.classList.add('done');
        if (isToday) cell.classList.add('today');
        if (isFuture) cell.classList.add('future');

        var numSpan = document.createElement('span');
        numSpan.className = 'num';
        numSpan.textContent = d;
        cell.appendChild(numSpan);

        if (hasEntry) {
          var tickSpan = document.createElement('span');
          tickSpan.className = 'tick';
          tickSpan.textContent = '✓';
          cell.appendChild(tickSpan);
        }

        if (!isFuture) {
          (function(dateStr) {
            cell.addEventListener('click', function() { onDayClick(dateStr); });
          })(iso);
        }

        $calendar.appendChild(cell);
      }

      $monthCount.textContent = monthCount + ' this month';
    }

    function renderStats() {
      var filled = [];
      for (var k in allEntries) {
        if (allEntries[k] && allEntries[k].trim()) filled.push(k);
      }
      $totalValue.textContent = filled.length;

      var set = {};
      for (var i = 0; i < filled.length; i++) set[filled[i]] = true;

      var d = new Date();
      var dISO = d.toLocaleDateString('en-CA');
      if (!set[dISO]) {
        d.setDate(d.getDate() - 1);
        dISO = d.toLocaleDateString('en-CA');
      }
      var streak = 0;
      while (set[dISO]) {
        streak++;
        d.setDate(d.getDate() - 1);
        dISO = d.toLocaleDateString('en-CA');
      }
      $streakValue.textContent = streak;
    }

    function renderFooter() {
      $footerBar.innerHTML = '';
      if (isUnlocked()) {
        var btn = document.createElement('button');
        btn.textContent = 'Lock this device';
        btn.addEventListener('click', function() {
          clearUnlocked();
          renderFooter();
          $panel.innerHTML = '<p class="empty-panel">Click any date to view or edit</p>';
        });
        $footerBar.appendChild(btn);
      }
    }

    function onDayClick(iso) {
      today = todayISO();
      var content = allEntries[iso] || '';
      var isPast = iso < today;
      var unlocked = isUnlocked();

      var dateObj = new Date(iso + 'T00:00:00');
      var formatted = dateObj.toLocaleDateString('en-US', {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
      });

      $panel.innerHTML = '';

      var h = document.createElement('h3');
      h.textContent = formatted;
      $panel.appendChild(h);

      // Past day: read only
      if (isPast) {
        var p = document.createElement('p');
        p.className = 'past-content';
        p.textContent = content || 'No entry written on this day.';
        $panel.appendChild(p);

        if (content) {
          var lock = document.createElement('div');
          lock.className = 'lock-badge';
          lock.textContent = '🔒 Locked';
          $panel.appendChild(lock);
        }
        return;
      }

      // Today, locked: PIN required
      if (!unlocked) {
        var preview = document.createElement('p');
        preview.className = 'past-content';
        preview.style.marginBottom = '1rem';
        preview.textContent = content || 'Nothing written for today yet.';
        $panel.appendChild(preview);

        var form = document.createElement('form');
        form.className = 'pin-form';

        var input = document.createElement('input');
        input.type = 'password';
        input.className = 'pin-input';
        input.placeholder = 'Enter PIN to edit';
        input.maxLength = 8;
        input.autocomplete = 'off';
        input.inputMode = 'numeric';
        form.appendChild(input);

        var btn = document.createElement('button');
        btn.type = 'submit';
        btn.className = 'pin-btn';
        btn.textContent = 'Unlock';
        form.appendChild(btn);

        $panel.appendChild(form);

        var hint = document.createElement('p');
        hint.className = 'pin-hint';
        hint.textContent = '// only the owner can edit. everyone can read.';
        $panel.appendChild(hint);

        form.addEventListener('submit', function(e) {
          e.preventDefault();
          if (input.value === PIN_CODE) {
            setUnlocked();
            renderFooter();
            onDayClick(iso);
          } else {
            input.value = '';
            input.placeholder = 'Wrong PIN — try again';
            input.style.borderColor = '#ef4444';
            setTimeout(function() {
              input.placeholder = 'Enter PIN to edit';
              input.style.borderColor = 'var(--border)';
            }, 1500);
          }
        });

        input.focus();
        return;
      }

      // Today, unlocked: editable
      var ta = document.createElement('textarea');
      ta.value = content;
      ta.placeholder = '// What did you work on today?';
      $panel.appendChild(ta);

      var saveBtn = document.createElement('button');
      saveBtn.textContent = 'Save Entry';
      saveBtn.className = 'save-btn';
      $panel.appendChild(saveBtn);

      var status = document.createElement('span');
      status.className = 'status';
      $panel.appendChild(status);

      saveBtn.addEventListener('click', function() {
        var text = ta.value.trim();
        if (!text) { status.textContent = '// write something first'; return; }

        saveBtn.disabled = true;
        status.textContent = 'Saving...';

        client.from('updates').upsert(
          { log_date: iso, content: text, updated_at: new Date().toISOString() },
          { onConflict: 'log_date' }
        ).then(function(res) {
          saveBtn.disabled = false;
          if (res.error) {
            status.textContent = 'Error: ' + res.error.message;
            return;
          }
          allEntries[iso] = text;
          status.textContent = '✓ Saved';
          renderCalendar();
          renderStats();
          setTimeout(function() { status.textContent = ''; }, 2000);
        });
      });

      ta.focus();
    }

    document.addEventListener('visibilitychange', function() {
      if (document.hidden) return;
      var newToday = todayISO();
      if (newToday !== today) {
        today = newToday;
        $panel.innerHTML = '<p class="empty-panel">Click any date to view or edit</p>';
        render();
      }
    });

    init();
  </script>
