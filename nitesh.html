 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nitesh - Timetable - EduTrack AI</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'Segoe UI', sans-serif; }
  .card { transition: all 0.2s ease; }
  .class-row { transition: all 0.2s ease; }
  .class-row:hover { transform: translateX(4px); }
  .today-highlight { box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.3); }
</style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-blue-50 min-h-screen">

<!-- HEADER -->
<div class="bg-white shadow-md sticky top-0 z-40">
  <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center flex-wrap gap-3">
    <div class="flex items-center gap-3">
      <div class="text-2xl">🎓</div>
      <div>
        <div class="font-bold text-slate-800">EduTrack AI — Timetable</div>
        <div class="text-xs text-slate-500">Career Point Hamirpur</div>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-lg text-sm font-semibold" id="todayDate"></span>
      <a href="home.html" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded-lg text-sm font-semibold">Close</a>
    </div>
  </div>
</div>

<!-- MAIN -->
<div class="max-w-6xl mx-auto p-4">

  <!-- Teacher Info -->
  <div class="bg-white rounded-2xl shadow-lg p-5 mb-4 flex items-center gap-4 flex-wrap">
    <div id="teacherAvatar" class="bg-gradient-to-br from-blue-500 to-purple-600 text-white w-16 h-16 rounded-full flex items-center justify-center text-2xl font-bold">NT</div>
    <div class="flex-1 min-w-[200px]">
      <h1 id="teacherName" class="text-2xl font-bold text-slate-800">Nitesh</h1>
      <p id="teacherInfo" class="text-sm text-slate-500">Mathematics • Science Department • nitesh@cp.com</p>
    </div>
    <div class="flex gap-2 flex-wrap">
      <div class="bg-blue-50 rounded-lg px-4 py-2 text-center">
        <div class="text-2xl font-bold text-blue-600" id="totalClasses">0</div>
        <div class="text-xs text-slate-500">Total/Week</div>
      </div>
      <div class="bg-green-50 rounded-lg px-4 py-2 text-center">
        <div class="text-2xl font-bold text-green-600" id="todayClasses">0</div>
        <div class="text-xs text-slate-500">Today</div>
      </div>
    </div>
  </div>

  <!-- Banner -->
  <div class="bg-purple-50 border-l-4 border-purple-500 rounded-lg p-4 mb-4">
    <div class="font-bold text-purple-800 mb-1">📅 Weekly Timetable</div>
    <div class="text-sm text-purple-700">Nitesh ke saare classes — Monday se Saturday tak. Aaj ka din highlight kiya gaya hai.</div>
  </div>

  <!-- Grid -->
  <div id="timetableGrid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-4"></div>

</div>

<script>
// ═══════════════════════════════════════════════════════════════
//                        TEACHER INFO
// ═══════════════════════════════════════════════════════════════
const TEACHER = {
  id: 'nitesh',
  name: 'Nitesh',
  email: 'nitesh@cp.com',
  subject: 'Mathematics',
  dept: 'Science'
};

// ═══════════════════════════════════════════════════════════════
//                     NITESH TIMETABLE DATA
//         day: 1=Mon, 2=Tue, 3=Wed, 4=Thu, 5=Fri, 6=Sat
// ═══════════════════════════════════════════════════════════════
const TIMETABLE = [
  // ─── MONDAY ───
  { teacherId:'nitesh', day:1, period:'II',  start:'10:05 AM', end:'10:55 AM', class:'MCA 1st',              semester:'1st', subject:'CA541/551', room:'608' },
  { teacherId:'nitesh', day:1, period:'III', start:'10:55 AM', end:'11:45 AM', class:'CSE 3rd (B)',          semester:'3rd', subject:'MA263',     room:'607' },
  { teacherId:'nitesh', day:1, period:'IV',  start:'11:45 AM', end:'12:35 PM', class:'BCA 3rd B / BSC IT / CS', semester:'3rd', subject:'MA263',   room:'607' },
  { teacherId:'nitesh', day:1, period:'VI',  start:'01:25 PM', end:'02:15 PM', class:'MCA 3rd',              semester:'3rd', subject:'CA584(C)',  room:'606' },

  // ─── TUESDAY ───
  { teacherId:'nitesh', day:2, period:'II',  start:'10:05 AM', end:'10:55 AM', class:'MCA 3rd',              semester:'3rd', subject:'CA584(C)',  room:'709' },
  { teacherId:'nitesh', day:2, period:'III', start:'10:55 AM', end:'11:45 AM', class:'MCA 1st',              semester:'1st', subject:'CA541/551', room:'607' },
  { teacherId:'nitesh', day:2, period:'IV',  start:'11:45 AM', end:'12:35 PM', class:'CSE 3rd (A)',          semester:'3rd', subject:'MA263',     room:'607' },

  // ─── WEDNESDAY ───
  { teacherId:'nitesh', day:3, period:'I',   start:'09:15 AM', end:'10:05 AM', class:'BCA 3rd B / BSC IT / CS', semester:'3rd', subject:'MA263',  room:'607' },
  { teacherId:'nitesh', day:3, period:'III', start:'10:55 AM', end:'11:45 AM', class:'BCA 3rd A + MCA 3rd',  semester:'3rd', subject:'MA263',     room:'609' },
  { teacherId:'nitesh', day:3, period:'IV',  start:'11:45 AM', end:'12:35 PM', class:'MCA 3rd + MSC IT 3rd', semester:'3rd', subject:'CA584(C)',  room:'606' },

  // ─── THURSDAY ───
  { teacherId:'nitesh', day:4, period:'I',   start:'09:15 AM', end:'10:05 AM', class:'MCA 1st + MSC IT 1st', semester:'1st', subject:'CA541/551', room:'607' },
  { teacherId:'nitesh', day:4, period:'II',  start:'10:05 AM', end:'10:55 AM', class:'B.SC IT 3rd + B.SC CS 3rd', semester:'3rd', subject:'MA263', room:'609' },
  { teacherId:'nitesh', day:4, period:'III', start:'10:55 AM', end:'11:45 AM', class:'CSE 3rd (B)',          semester:'3rd', subject:'MA263',     room:'606' },
  { teacherId:'nitesh', day:4, period:'VII', start:'02:15 PM', end:'03:05 PM', class:'MSC IT 3rd',           semester:'3rd', subject:'CA584(C)',  room:'606' },

  // ─── FRIDAY ───
  { teacherId:'nitesh', day:5, period:'II',  start:'10:05 AM', end:'10:55 AM', class:'BCA 3rd A + MCA 3rd',  semester:'3rd', subject:'MA263',     room:'607' },
  { teacherId:'nitesh', day:5, period:'III', start:'10:55 AM', end:'11:45 AM', class:'MCA 3rd + MSC IT 3rd', semester:'3rd', subject:'CA584(C)',  room:'606' },
  { teacherId:'nitesh', day:5, period:'IV',  start:'11:45 AM', end:'12:35 PM', class:'BCA 3rd B / BSC IT / CS', semester:'3rd', subject:'MA263',  room:'608' },
  { teacherId:'nitesh', day:5, period:'VII', start:'02:15 PM', end:'03:05 PM', class:'CSE 3rd (A)',          semester:'3rd', subject:'MA263',     room:'609' },

  // ─── SATURDAY ───
  { teacherId:'nitesh', day:6, period:'III', start:'10:55 AM', end:'11:45 AM', class:'BCA 3rd A',            semester:'3rd', subject:'MA263',     room:'609' },
  { teacherId:'nitesh', day:6, period:'IV',  start:'11:45 AM', end:'12:35 PM', class:'CSE 3rd (A)',          semester:'3rd', subject:'MA263',     room:'607' },
  { teacherId:'nitesh', day:6, period:'VI',  start:'01:25 PM', end:'02:15 PM', class:'CSE 3rd (B)',          semester:'3rd', subject:'MA263',     room:'607' }
];

// ==================== HELPERS ====================
function formatDate(d) {
  return d.toLocaleDateString('en-IN', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' });
}

// ==================== INIT ====================
window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('todayDate').textContent = formatDate(new Date());

  const myClasses = TIMETABLE.filter(t => t.teacherId === TEACHER.id);
  document.getElementById('totalClasses').textContent = myClasses.length;

  const todayDay = new Date().getDay(); // 0=Sun, 1=Mon...6=Sat
  const todayCount = myClasses.filter(c => c.day === todayDay).length;
  document.getElementById('todayClasses').textContent = todayCount;

  const dayNames = { 1: 'Monday', 2: 'Tuesday', 3: 'Wednesday', 4: 'Thursday', 5: 'Friday', 6: 'Saturday' };
  const dayColors = {
    1: 'from-blue-500 to-blue-600',
    2: 'from-green-500 to-green-600',
    3: 'from-purple-500 to-purple-600',
    4: 'from-orange-500 to-orange-600',
    5: 'from-pink-500 to-pink-600',
    6: 'from-slate-500 to-slate-700'
  };

  let gridHTML = '';
  for (let day = 1; day <= 6; day++) {
    const dayClasses = myClasses
      .filter(c => c.day === day)
      .sort((a, b) => a.period.localeCompare(b.period));
    const isToday = day === todayDay;

    gridHTML += `
      <div class="card bg-white border-2 ${isToday ? 'border-blue-500 today-highlight' : 'border-slate-200'} rounded-2xl overflow-hidden">
        <div class="bg-gradient-to-r ${dayColors[day]} text-white px-4 py-3 flex justify-between items-center">
          <div>
            <div class="font-bold">${dayNames[day]}</div>
            <div class="text-xs opacity-90">${dayClasses.length} ${dayClasses.length === 1 ? 'class' : 'classes'}</div>
          </div>
          ${isToday ? '<span class="bg-white text-blue-600 text-[10px] font-bold px-2 py-0.5 rounded-full">TODAY</span>' : ''}
        </div>
        <div class="p-3 space-y-2">
          ${dayClasses.length === 0 ? `
            <div class="text-center py-6 text-slate-400 text-xs">No classes</div>
          ` : dayClasses.map(c => `
            <div class="class-row bg-slate-50 rounded-lg p-3 border-l-4 border-blue-500">
              <div class="flex justify-between items-start gap-2 mb-1">
                <span class="bg-blue-600 text-white text-[11px] px-2 py-0.5 rounded font-bold">Period ${c.period}</span>
                <span class="text-[10px] text-slate-500 font-semibold">Room ${c.room}</span>
              </div>
              <div class="font-semibold text-slate-800 text-sm">${c.class}</div>
              <div class="text-[11px] text-slate-500 mt-0.5">📘 ${c.subject} • Sem ${c.semester}</div>
              <div class="flex items-center justify-between mt-1">
                <span class="text-xs text-slate-600">⏰ ${c.start} – ${c.end}</span>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  document.getElementById('timetableGrid').innerHTML = gridHTML;
});
</script>
</body>
</html>
